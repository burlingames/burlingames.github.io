<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Burlingames</title>
<style>
  :root { color-scheme: light dark; --ink: #111; --muted: #6b6b70; --bg: #fbf8f2; --rule: rgba(128,128,128,.25); }
  @media (prefers-color-scheme: dark) { :root { --ink: #f4f4f6; --muted: #a0a0a8; --bg: #17141c; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, system-ui, "SF Pro Text", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 64px 20px; }
  h1 { font-size: 28px; margin: 0 0 32px; }
  ul { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--rule); }
  li { padding: 16px 0; border-bottom: 1px solid var(--rule); display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  a { color: inherit; }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Burlingames</h1>
  <ul>
    <li><a href="megaspoon/">MegaSpoon</a> <a class="muted" href="megaspoon/privacy.html">Privacy &amp; support</a></li>
  </ul>
</main>
</body>
</html>
