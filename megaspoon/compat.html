<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MegaSpoon</title>
<!--
  MegaSpoon compatibility landing page. Host this file as a static page (GitHub Pages, Netlify,
  Cloudflare Pages) at the URL set in LinkCodec.webBase inside the app (https://burlingames.github.io/megaspoon/compat.html).
  The friend's favorites travel in the URL fragment (#...), which never reaches the server.
  Flow: try to open the app via its custom scheme; if the page is still visible a moment later,
  the app is not installed, so offer the App Store.
-->
<style>
  :root { color-scheme: light dark; --accent: #fa6b4a; --ink: #111; --muted: #6b6b70; --card: #f4f2f6; }
  @media (prefers-color-scheme: dark) { :root { --ink: #f4f4f6; --muted: #a0a0a8; --card: #232028; } }
  body { margin: 0; font-family: -apple-system, system-ui, "SF Pro Text", sans-serif; background: linear-gradient(160deg, #fe7f52 0%, #e64d57 55%, #6b2a4c 100%); min-height: 100vh; display: grid; place-items: center; color: var(--ink); }
  .card { background: var(--card); border-radius: 24px; padding: 28px 24px; width: min(420px, calc(100vw - 32px)); box-shadow: 0 24px 60px rgba(0,0,0,.25); text-align: center; }
  .logo { width: 84px; height: 84px; border-radius: 20px; margin: 0 auto 14px; background: linear-gradient(140deg, #fe7f52, #e64d57 60%, #6b2a4c); display: grid; place-items: center; }
  h1 { font-size: 22px; margin: 6px 0 4px; }
  p { color: var(--muted); margin: 6px 0 18px; line-height: 1.4; }
  .btn { display: block; width: 100%; box-sizing: border-box; padding: 14px 18px; border-radius: 999px; font-weight: 600; font-size: 17px; text-decoration: none; margin-top: 10px; }
  .primary { background: var(--accent); color: white; }
  .secondary { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
  .hidden { display: none; }
  .spinner { width: 28px; height: 28px; border: 3px solid rgba(250,107,74,.25); border-top-color: var(--accent); border-radius: 50%; margin: 10px auto; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .list { text-align: left; margin: 0 0 8px; padding: 0; list-style: none; max-height: 160px; overflow: auto; }
  .list li { padding: 8px 0; border-bottom: 1px solid rgba(128,128,128,.15); font-size: 15px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg width="56" height="56" viewBox="0 0 100 100" fill="none" stroke="#fff" stroke-linecap="round" stroke-width="7">
      <line x1="30" y1="82" x2="66" y2="34"/>
      <ellipse cx="72" cy="26" rx="14" ry="10" fill="#fff" stroke="none" transform="rotate(-53 72 26)"/>
    </svg>
  </div>
  <h1 id="title">Opening MegaSpoon…</h1>
  <p id="detail">Hang on a second.</p>
  <div id="spinner" class="spinner"></div>
  <ul id="places" class="list hidden"></ul>
  <div id="fallback" class="hidden">
    <a id="store" class="btn primary" href="#">Get MegaSpoon on the App Store</a>
    <a id="retry" class="btn secondary" href="#">I already have it, open the app</a>
  </div>
</div>
<script>
(function () {
  // Replace with the real App Store link once the app is listed.
  var APP_STORE_URL = "https://apps.apple.com/app/megaspoon/id0000000000";
  var fragment = location.hash.replace(/^#/, "");
  var params = new URLSearchParams(fragment);
  var flag = params.get("f") || "j";
  var data = params.get("d") || "";
  var kind = params.get("t") || "compat";   // "compat" = favorites, "join" = a shared pick
  var appURL = "megaspoon://" + kind + "?f=" + encodeURIComponent(flag) + "&d=" + encodeURIComponent(data);

  var title = document.getElementById("title"), detail = document.getElementById("detail");
  var fallback = document.getElementById("fallback"), spinner = document.getElementById("spinner");
  document.getElementById("store").href = APP_STORE_URL;
  document.getElementById("retry").href = appURL;

  // Best-effort preview of who sent what, so the page is worth reading even without the app.
  function b64urlToBytes(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "=";
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  async function preview() {
    if (!data) return;
    try {
      var bytes = b64urlToBytes(data);
      var json;
      if (flag === "z" && typeof DecompressionStream !== "undefined") {
        var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
        json = await new Response(stream).text();
      } else if (flag !== "z") {
        json = new TextDecoder().decode(bytes);
      }
      if (!json) return;
      var payload = JSON.parse(json);
      if (kind === "join") {
        detail.textContent = (payload.from || "A friend") + " is heading to " + (payload.name || "a spot") + " and wants you along. Open MegaSpoon to join the same pick and earn your own stamp.";
        return;
      }
      var n = (payload.places || []).length;
      detail.textContent = (payload.from || "A friend") + " shared " + n + " place" + (n === 1 ? "" : "s") + " they'd go again. Open MegaSpoon to see which ones you both love, then pull the lever.";
      var list = document.getElementById("places");
      (payload.places || []).slice(0, 8).forEach(function (p) { var li = document.createElement("li"); li.textContent = p.n; list.appendChild(li); });
      if (n > 0) list.classList.remove("hidden");
    } catch (e) { /* preview is optional */ }
  }

  function showFallback() {
    spinner.classList.add("hidden");
    title.textContent = "MegaSpoon isn't installed yet";
    fallback.classList.remove("hidden");
  }

  preview();
  var opened = false;
  document.addEventListener("visibilitychange", function () { if (document.hidden) opened = true; });
  window.addEventListener("pagehide", function () { opened = true; });
  // Try the app. If we are still here and visible shortly after, it is not installed.
  setTimeout(function () { location.href = appURL; }, 150);
  setTimeout(function () { if (!opened && !document.hidden) showFallback(); }, 2200);
})();
</script>
</body>
</html>
